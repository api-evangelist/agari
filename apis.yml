name: Agari
description: >-
  Agari is an email-security provider that pioneered and helped author the DMARC
  email-authentication standard to protect organizations from phishing, business
  email compromise (BEC), email spoofing, and brand impersonation. Founded in 2009,
  Agari was acquired by HelpSystems (now Fortra) in May 2021 and is delivered as
  Fortra's email-security portfolio, including DMARC Protection / Brand Protection,
  Phishing Defense, and Phishing Response. The Agari Platform exposes a RESTful JSON
  API secured with OAuth 2.0 Client Credentials for retrieving security telemetry,
  auditing users and domains, tracking DMARC policy enforcement, and integrating
  Agari data into SIEM and SOAR tooling. It was originally backed by Norwest Venture
  Partners and other venture investors before its acquisition.
