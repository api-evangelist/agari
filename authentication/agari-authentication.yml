summary:
  types: [oauth2]
  oauth2_flows: [clientCredentials]
  token_lifetime: 4 hours
  notes: >-
    The Agari Platform APIs use OAuth 2.0 with the Client Credentials grant.
    A client_id and client_secret are generated manually in the product portal,
    then exchanged at the token endpoint for a temporary bearer access_token
    valid for four hours. The access_token is presented on subsequent API
    requests. There is no documented per-scope authorization surface.
schemes:
  - name: OAuth2ClientCredentials
    type: oauth2
    flow: clientCredentials
    token_url: https://api.agari.com/v1/ep/token
    token_lifetime_seconds: 14400
    credential_provisioning: manual (generated in the Agari product portal)
    token_presentation: bearer access_token on API requests
    sources: [https://developers.agari.com/agari-platform/docs/oauth-20]
